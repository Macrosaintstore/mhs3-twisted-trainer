[project]
name = "mhs3-twisted-trainer"
version = "0.6.2"
description = "Trainer for Monster Hunter Stories 3: Twisted Reflection"
requires-python = ">=3.11"
dependencies = [
    "pymem>=1.12.0",
    "pywin32>=306",
    "keyboard>=0.13.5",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pydantic>=2.6.3",
]

[project.scripts]
mhs3-trainer = "monster_trainer.bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"